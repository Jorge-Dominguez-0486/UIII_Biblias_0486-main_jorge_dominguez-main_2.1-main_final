<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Administración de Biblias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      body {
        background-color: #f0f2f5; /* Fondo gris azulado suave */
      }
      
      /* Cabecera y Navbar */
      .bg-light { /* Usado por header.html */
        background-color: #ffffff !important; /* Blanco limpio */
        border-bottom: 1px solid #dee2e6;
      }
      .bg-white { /* Usado por navbar.html */
        box-shadow: 0 2px 4px rgba(0,0,0,.08);
      }
      .navbar-brand, .h4 {
        color: #0d6efd; /* Azul principal de Bootstrap */
      }

      /* Estilos de botones (colores más vivos) */
      .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
      }
      .btn-success {
        background-color: #198754; /* Un verde más intenso */
        border-color: #198754;
      }
      .btn-info {
        background-color: #0dcaf0; /* Cyan brillante */
        border-color: #0dcaf0;
        color: #000;
      }
      .btn-danger {
        background-color: #dc3545;
        border-color: #dc3545;
      }

      /* Pie de página */
      .bg-dark {
        background-color: #212529 !important; /* Un negro más suave */
      }
    </style>
    </head>
  <body class="d-flex flex-column min-vh-100">
    
    {% include 'header.html' %}
    
    {% include 'navbar.html' %}
    
    <main class="container my-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
    
    {% include 'footer.html' %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

{% extends 'base.html' %}
{% block content %}
<h3>Actualizar Detalle de Pedido #{{ detalle.id }}</h3>
<form method="POST" action="{% url 'realizar_actualizacion_detalle_pedido' detalle.id %}">
  {% csrf_token %}
  
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Pedido (ID Cliente)</label>
      <select class="form-control" name="pedido" required>
        {% for p in pedidos %}
          <option value="{{ p.id }}" {% if p.id == detalle.pedido.id %}selected{% endif %}>
            Pedido #{{ p.id }} (Cliente: {{ p.cliente.apellido }})
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label>ID de Producto</label>
      <input class="form-control" name="producto_id" type="number" value="{{ detalle.producto_id }}" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Número de Línea</label>
      <input class="form-control" name="numero_linea" type="number" value="{{ detalle.numero_linea }}" required>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Cantidad</label>
      <input class="form-control" name="cantidad" type="number" value="{{ detalle.cantidad }}" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Precio Unitario</label>
      <input class="form-control" name="precio_venta_unitario" type="number" step="0.01" value="{{ detalle.precio_venta_unitario|stringformat:'f' }}" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Subtotal</label>
      <input class="form-control" name="subtotal_detalle" type="number" step="0.01" value="{{ detalle.subtotal_detalle|stringformat:'f' }}" required>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Descuento (%)</label>
      <input class="form-control" name="porcentaje_descuento" type="number" step="0.01" value="{{ detalle.porcentaje_descuento|stringformat:'f' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label>Impuesto del Item</label>
      <input class="form-control" name="impuesto_detalle" type="number" step="0.01" value="{{ detalle.impuesto_detalle|stringformat:'f' }}">
    </div>
  </div>

  <div class="mb-3">
    <label>Notas del Item</label>
    <textarea class="form-control" name="notas_item" rows="2">{{ detalle.notas_item|default_if_none:'' }}</textarea>
  </div>
  
  <button class="btn btn-success" type="submit">Guardar Cambios</button>
  <a class="btn btn-secondary" href="{% url 'ver_detalles' %}">Cancelar</a>
</form>
{% endblock %}

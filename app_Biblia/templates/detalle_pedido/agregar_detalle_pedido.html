{% extends 'base.html' %}
{% block content %}
<h3>Agregar Detalle de Pedido</h3>
<form method="POST">
  {% csrf_token %}
  
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Pedido (ID Cliente)</label>
      <select class="form-control" name="pedido" required>
        <option value="">-- Seleccionar Pedido --</option>
        {% for p in pedidos %}
          <option value="{{ p.id }}">Pedido #{{ p.id }} (Cliente: {{ p.cliente.apellido }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label>ID de Producto</label>
      <input class="form-control" name="producto_id" type="number" placeholder="Ej: 1001" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Número de Línea</label>
      <input class="form-control" name="numero_linea" type="number" placeholder="Ej: 1" required>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Cantidad</label>
      <input class="form-control" name="cantidad" type="number" value="1" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Precio Unitario</label>
      <input class="form-control" name="precio_venta_unitario" type="number" step="0.01" value="0.00" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Subtotal</label>
      <input class="form-control" name="subtotal_detalle" type="number" step="0.01" value="0.00" required>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Descuento (%)</label>
      <input class="form-control" name="porcentaje_descuento" type="number" step="0.01" value="0.00">
    </div>
    <div class="col-md-6 mb-3">
      <label>Impuesto del Item</label>
      <input class="form-control" name="impuesto_detalle" type="number" step="0.01" value="0.00">
    </div>
  </div>

  <div class="mb-3">
    <label>Notas del Item</label>
    <textarea class="form-control" name="notas_item" rows="2"></textarea>
  </div>
  
  <button class="btn btn-primary" type="submit">Agregar Detalle</button>
</form>
{% endblock %}
